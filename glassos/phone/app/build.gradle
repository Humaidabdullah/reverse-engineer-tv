plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvremote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvremote'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Installed from the TV, never from a store: the debug key is enough to install and update it.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
